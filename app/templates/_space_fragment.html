{% if space.error %}
<span class="space-critical">{{ _("space.unknown") }}</span>
{% elif space.percent_used <= 0.80 %}
<span class="space-ok">{{ space.free_gb }} {{ _("space.gb_free") }}</span>
{% elif space.percent_used <= 0.90 %}
<span class="space-warn">{{ space.free_gb }} {{ _("space.gb_free") }}</span>
{% else %}
<span class="space-critical">{{ space.free_gb }} {{ _("space.gb_free") }}</span>
{% endif %}
