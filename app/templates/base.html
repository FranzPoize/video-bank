<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ _("nav.video_bank") }}{% endblock %}</title>
    <script src="/static/js/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/">{{ _("nav.video_bank") }}</a>
        <a href="/upload">{{ _("nav.upload") }}</a>
        <a href="/settings">{{ _("nav.settings") }}</a>
        <span id="space-indicator" style="margin-left: auto;" hx-get="/api/space" hx-trigger="load"></span>

        <!-- Language dropdown -->
        <div class="lang-dropdown">
            <button class="lang-btn" id="lang-btn" type="button">
                <span class="lang-flag">{{ current_flag }}</span>
                <span class="lang-code">{{ current_lang.upper() }}</span>
                <span class="lang-arrow">▼</span>
            </button>
            <div class="lang-menu" id="lang-menu">
                <a hx-post="/api/lang" hx-vals='{"lang": "en"}' hx-target="body">
                    <span class="lang-flag">🇬🇧</span>{{ _("lang.en") }}
                </a>
                <a hx-post="/api/lang" hx-vals='{"lang": "fr"}' hx-target="body">
                    <span class="lang-flag">🇫🇷</span>{{ _("lang.fr") }}
                </a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% include "_upload_popup.html" %}

    <!-- i18n translations for JavaScript -->
    <script>
        window.TRANSLATIONS = {
            "upload.untitled": "{{ _('upload.untitled') }}",
            "upload.completed": "{{ _('upload.completed') }}",
            "upload.failed": "{{ _('upload.failed') }}",
            "upload.network_error": "{{ _('upload.network_error') }}",
            "upload.resumed": "{{ _('upload.resumed') }}",
            "btn.retry": "{{ _('btn.retry') }}",
            "clip.creating": "{{ _('clip.creating') }}",
            "btn.create_clip": "{{ _('btn.create_clip') }}",
            "clip.min_duration": "{{ _('clip.min_duration') }}",
            "clip.failed": "{{ _('clip.failed') }}",
            "clip.network_error": "{{ _('clip.network_error') }}"
        };
        window._ = function(key) {
            return window.TRANSLATIONS[key] || key;
        };
    </script>

    <!-- Language dropdown toggle -->
    <script>
        (function() {
            var btn = document.getElementById('lang-btn');
            var menu = document.getElementById('lang-menu');
            if (btn && menu) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function() {
                    menu.classList.remove('open');
                });
                menu.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }
        })();
    </script>

    <script src="/static/js/upload.js"></script>
    <script src="/static/js/clipper.js"></script>
</body>
</html>
