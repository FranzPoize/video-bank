{% extends "base.html" %}
{% block title %}Clip: {{ video.name }} — Video Bank{% endblock %}

{% block content %}
<div class="video-wrapper">
    <div style="margin-bottom: 1rem;">
        <a href="/video/{{ video.id }}" style="color: #4361ee; text-decoration: none; display: inline-block; margin-bottom: 0.5rem;">
            &larr; Back to video
        </a>
        <h1 style="margin-bottom: 0.25rem;">Create Clip</h1>
        <p style="color: #888; font-size: 0.9rem;">
            Source: {{ video.name }}
        </p>
    </div>

    <div id="clipper">
        <!-- Video Player -->
        <div class="video-player">
            <video id="clip-video" controls preload="metadata">
                <source src="{{ video.video_url }}" type="{{ video.mime_type }}">
                Your browser does not support the video element.
            </video>
        </div>

        <!-- Seeker Controls -->
        <div id="seeker" class="seeker-controls">
            <div class="seeker-row">
                <span class="seeker-label seeker-start">Start</span>
                <input type="range" id="clip-start" min="0" max="100" step="0.1" value="0" class="seeker-slider">
            </div>
            <div class="seeker-row">
                <span class="seeker-label seeker-end">End</span>
                <input type="range" id="clip-end" min="0" max="100" step="0.1" value="0" class="seeker-slider">
            </div>

            <!-- Timestamp Display -->
            <div id="clip-times" class="seeker-times">
                0s / 0s (0s)
            </div>

            <p class="seeker-hint">
                Click the timeline to seek. Minimum clip duration: 1 second.
            </p>

            <!-- Error Display -->
            <div id="clip-error" class="seeker-error"></div>

            <!-- Create Button -->
            <div style="text-align: center;">
                <button id="create-clip-btn" class="btn btn-primary"
                        data-video-id="{{ video.id }}">
                    Create Clip
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
