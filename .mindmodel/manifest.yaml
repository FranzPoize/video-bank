# Video Bank — .mindmodel Manifest
# Generated from codebase analysis of /home/franz/project/video-bank

name: video-bank
version: 2
description: >
  Self-hosted video clip manager. Python/FastAPI backend with Jinja2+HTMX frontend,
  SQLite storage, ffmpeg-based video processing. Single-process monolith deployed
  via systemd on Ubuntu.

